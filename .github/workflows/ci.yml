
name: CI | GenAI API

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: genai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d genai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/genai_test
      KEYCLOAK_ISSUER: https://example.com/realms/test
      KEYCLOAK_AUDIENCE: genai-api
      LITELLM_BASE_URL: https://example.com
      LITELLM_API_KEY: test-key
      PAPI_BASE_URL: https://example.com
      GENAI_KEY_NAME: genai_app_test
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v
