services:
  postgres:
    image: postgres:16
    container_name: genai-postgres
    environment:
      POSTGRES_USER: genai
      POSTGRES_PASSWORD: genai
      POSTGRES_DB: genai_dev
    ports:
      - "5432:5432"
    volumes:
      - genai_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  genai_postgres_data:
